<style>
/* Layout: a phone-first app shell. List view = filter chips + card grid; dish view = photo, level switch, ingredients, timed steps. */
:root{
  --bg:#f6f7f3; --surface:#ffffff; --ink:#1e2620; --muted:#5f6a62; --line:#dfe3da;
  --accent:#4f6a2a; --accent-ink:#ffffff; --accent-soft:#e6ecd9;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c-legumes:#b8873a; --c-ladera:#5d8a3c; --c-pasta:#c9a23a; --c-meat:#a2493a; --c-chicken:#c47a3a; --c-fish:#3a7a9a; --c-veg:#7a8a3a; --c-dessert:#9a4a6a;
  --hob:#b5532e; --af:#2f6f8f; --mw:#6a5a9a;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131713; --surface:#1c221d; --ink:#e8ece5; --muted:#a3ada4; --line:#2e362f;
  --accent:#a7c46e; --accent-ink:#152008; --accent-soft:#2a3520; --hob:#e8936e; --af:#7fbfdc; --mw:#b5a6e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131713; --surface:#1c221d; --ink:#e8ece5; --muted:#a3ada4; --line:#2e362f;
  --accent:#a7c46e; --accent-ink:#152008; --accent-soft:#2a3520; --hob:#e8936e; --af:#7fbfdc; --mw:#b5a6e0; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{padding-block:20px 8px;display:flex;flex-direction:column;gap:12px}
.top h1{font-size:28px}
.top p{margin:0;color:var(--muted)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.photo{aspect-ratio:4/3;max-width:100%;width:100%;display:grid;place-items:center;position:relative;color:#fff;overflow:hidden}
.photo .gr{font-family:var(--font-display);font-weight:700;font-size:20px;padding:0 12px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.photo .ph{position:absolute;bottom:8px;right:10px;font-size:11px;opacity:.85}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:15.5px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.clock{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* dish view */
.dish{padding-top:14px}
.back{border:none;background:none;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.levels{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{border-radius:var(--radius);margin-top:8px}
.hero .gr{font-size:30px}
.title{margin-top:14px;display:flex;flex-direction:column;gap:4px}
.title h2{font-size:26px}
.title .sub{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact b{display:block;font-family:var(--font-display);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ahead{margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.section{margin-top:24px}
.section h3{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:14px;font-weight:500}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.stepper span{min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
ul.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
ul.ing li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
ul.ing li:first-child{border-top:none}
ul.ing .q{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.staples{margin-top:10px;font-size:14px;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;counter-increment:s}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:600;font-size:13px}
ol.steps .t{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent)}
ol.steps .flag{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.note{margin-top:28px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.heat{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid currentColor}
.heat.hob{color:var(--hob)} .heat.af{color:var(--af)} .heat.mw{color:var(--mw)}
ol.steps .flag{margin-top:0}
.bnote{margin:0 0 10px;color:var(--muted);font-size:14px}
ul.basics li{grid-template-columns:1fr auto}
ul.basics .q{font-weight:500;text-align:right}
@media (min-width:700px){.hero{aspect-ratio:21/9}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

 {title:"Is it cooked?", note:"A cheap probe thermometer takes the guessing out.",
  rows:[["Chicken","75°C in the thickest part, juices run clear"],["Minced meat (biftekia)","71°C, no pink in the middle"],["Salmon","Flakes easily; 63°C is the official safe temperature"],["Pork chops","63°C, then rest 3 min"]]}
];

const LEVELS=[["basic","Basic"],["intermediate","Intermediate"],["advanced","Advanced"]];
const CAT_COLOR={"Legumes":"--c-legumes","Ladera":"--c-ladera","Pasta":"--c-pasta","Meat":"--c-meat","Chicken":"--c-chicken","Fish & seafood":"--c-fish","Potatoes & vegetables":"--c-veg","Desserts":"--c-dessert"};
const CATEGORIES=["All",...new Set(RECIPES.map(r=>r.category))];
const MEALS=["All meals",...new Set(RECIPES.flatMap(r=>r.meals))];
const TIMES=[["any","Any time",()=>true],["30","Up to 30 min",m=>m<=30],["60","30 min – 1 h",m=>m>30&&m<=60],["60+","Over 1 h",m=>m>60]];
const CLOCK='<svg class="clock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.5V8l2.4 1.6"/></svg>';
const state={cat:"All",meal:"All meals",time:"any",q:"",level:"intermediate",portions:BASE};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function totalMin(v){return v.steps.filter(s=>!s[2]).reduce((a,s)=>a+s[1],0)}
function fmtMin(m){if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"")}
function aheadOf(v){return v.steps.find(s=>s[2]==="a")}
const HOB={"low":"3–4","medium-low":"5–6","medium":"7–8","medium-high":"9–10","high":"11–12"};
function heat(h){if(!h)return "";const [k,v]=h.split(":");
  const t=k==="H"?["hob","Hob",HOB[v]+" ("+v+")"]:k==="AF"?["af","Air fryer",v+"°C"]:["mw","Microwave",v+" W"];
  return `<span class="heat ${t[0]}">${t[1]} · ${t[2]}</span>`}
function photo(r,cls=""){const c=`var(${CAT_COLOR[r.category]||"--accent"})`;
  return `<div class="photo ${cls}" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 60%,#000))"><span class="gr">${esc(r.nameGr)}</span><span class="ph">Photo later</span></div>`}
function fmtQty(q,unit){
  if(q==null)return "";
  if(unit==="g"||unit==="ml"){q=q>=50?Math.round(q/5)*5:Math.round(q);
    if(q>=1000)return (Math.round(q/100)/10)+" "+(unit==="g"?"kg":"L");
    return q+" "+unit}
  let r=Math.round(q*4)/4; if(r===0)r=0.25;
  const w=Math.floor(r),f=r-w,fr={0.25:"¼",0.5:"½",0.75:"¾"}[f]||"";
  const n=(w?w:"")+fr; return unit?`${n} ${unit}`:n}
function nav(active){return `<nav class="tabs"><a href="#" aria-current="${active==="dishes"}">Dishes</a><a href="#basics" aria-current="${active==="basics"}">Kitchen basics</a></nav>`}
function chipRow(label,key,opts){return `<div><div class="label">${label}</div><div class="chips">${opts.map(([v,l])=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${v===state[key]}">${esc(l)}</button>`).join("")}</div></div>`}
function list(){
  const q=state.q.trim().toLowerCase(),tf=TIMES.find(t=>t[0]===state.time)[2];
  const items=RECIPES.filter(r=>(state.cat==="All"||r.category===state.cat)&&(state.meal==="All meals"||r.meals.includes(state.meal))&&tf(totalMin(r.versions.intermediate))&&(!q||(r.name+" "+r.nameGr).toLowerCase().includes(q)));
  app.innerHTML=`<header class="top"><h1>My Recipe Book</h1>${nav("dishes")}
    <input class="search" id="search" type="search" placeholder="Search ${RECIPES.length} dishes" value="${esc(state.q)}">
    ${chipRow("Category","cat",CATEGORIES.map(c=>[c,c]))}
    ${chipRow("Meal","meal",MEALS.map(c=>[c,c]))}
    ${chipRow("Time (intermediate version)","time",TIMES.map(t=>[t[0],t[1]]))}</header>
    <div class="grid">${items.map(r=>{const v=r.versions.intermediate,a=aheadOf(v);
      return `<button class="card" data-id="${r.id}">${photo(r)}<div class="body"><h3>${esc(r.name)}</h3>
      <div class="meta"><span class="pill">Intermediate</span><span>${CLOCK}${fmtMin(totalMin(v))}</span></div>
      ${a?`<div class="meta">+ prep the night before</div>`:""}</div></button>`}).join("")||'<div class="empty">No dishes match these filters.</div>'}</div>`;
  document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;const pos=e.target.selectionStart;list();const n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)});
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{state[b.dataset.k]=b.dataset.v;list()});
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
}
function basics(){
  app.innerHTML=`<header class="top"><h1>My Recipe Book</h1>${nav("basics")}<p>Quick reference for your kitchen: electric hob, air fryer and microwave. Times are approximate, so check doneness.</p>
  <input class="search" id="bsearch" type="search" placeholder="Search, e.g. broccoli, salmon, eggs"></header>
  ${BASICS.map(b=>`<section class="section bsec"><h3>${esc(b.title)}</h3><p class="bnote">${esc(b.note)}</p>
    <ul class="ing basics">${b.rows.map(r=>`<li data-s="${esc((b.title+" "+r[0]+" "+r[1]).toLowerCase())}"><span>${esc(r[0])}</span><span class="q">${esc(r[1])}</span></li>`).join("")}</ul></section>`).join("")}
  <div class="empty" id="bempty" hidden>Nothing found. Ask me and I'll add it.</div>`;
  document.getElementById("bsearch").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();let any=false;
    app.querySelectorAll(".bsec").forEach(sec=>{let n=0;sec.querySelectorAll("li").forEach(li=>{const ok=!q||li.dataset.s.includes(q);li.hidden=!ok;if(ok)n++});
      sec.querySelector(".bnote").hidden=!!q;sec.hidden=n===0;if(n)any=true});
    document.getElementById("bempty").hidden=any});
}
function dish(r){
  const v=r.versions[state.level],a=aheadOf(v),k=state.portions/BASE;
  const main=v.ing.filter(i=>!i[3]),staples=v.ing.filter(i=>i[3]);
  app.innerHTML=`<div class="dish"><button class="back" id="back">← All dishes</button>
    <div class="levels"><div class="seg" role="group" aria-label="Version">${LEVELS.map(([k2,l])=>`<button data-level="${k2}" aria-pressed="${k2===state.level}">${l}</button>`).join("")}</div></div>
    ${photo(r,"hero")}
    <div class="title"><div class="label">${esc(r.category)} · ${r.meals.map(esc).join(", ")}</div><h2>${esc(r.name)}</h2><div class="sub">${esc(r.nameGr)}</div></div>
    <div class="facts"><div class="fact"><span class="label">Total time</span><b>${fmtMin(totalMin(v))}</b></div>
      <div class="fact"><span class="label">Difficulty</span><b>${v.difficulty}</b></div>
      <div class="fact"><span class="label">Keeps</span><b>${r.keeps} day${r.keeps>1?"s":""}</b></div></div>
    ${a?`<div class="ahead"><b>Start the night before.</b> ${esc(a[0])}</div>`:""}
    <div class="section"><h3>Ingredients <span class="stepper"><button id="minus" aria-label="Fewer portions">−</button><span>${state.portions} portion${state.portions>1?"s":""}</span><button id="plus" aria-label="More portions">+</button></span></h3>
      <ul class="ing">${main.map(i=>`<li><span class="q">${fmtQty(i[0]*k,i[1])}</span><span>${esc(i[2])}</span></li>`).join("")}</ul>
      ${staples.length?`<div class="staples"><b>From your pantry:</b> ${staples.map(i=>esc((i[0]!=null?fmtQty(i[0]*k,i[1])+" ":"")+i[2])).join(", ")}</div>`:""}</div>
    <div class="section"><h3>Steps</h3><ol class="steps">${v.steps.filter(s=>s[2]!=="a").map(s=>`<li><div>${esc(s[0])}<div class="tags">${heat(s[3])}${s[2]==="p"?'<span class="flag">Runs alongside the other steps</span>':""}</div></div><span class="t">${fmtMin(s[1])}</span></li>`).join("")}</ol></div>
    <p class="note">Written for an electric hob, air fryer and microwave. Photos come in a later step.</p></div>`;
  document.getElementById("back").onclick=()=>{location.hash=""};
  app.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{state.level=b.dataset.level;dish(r)});
  document.getElementById("minus").onclick=()=>{if(state.portions>1){state.portions--;dish(r)}};
  document.getElementById("plus").onclick=()=>{if(state.portions<20){state.portions++;dish(r)}};
}
let lastId=null;
function route(){const id=location.hash.slice(1),r=RECIPES.find(x=>x.id===id);
  if(id==="basics"){lastId=null;basics();window.scrollTo(0,0);return}
  if(r){if(id!==lastId){state.level="intermediate";state.portions=BASE;window.scrollTo(0,0)}lastId=id;dish(r)}else{lastId=null;list()}}
window.addEventListener("hashchange",route);route();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}
</script>
</body>
</html>
